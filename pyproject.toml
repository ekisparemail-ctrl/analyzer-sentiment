[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
# Matches the actual venv interpreter (3.13), not target-version above --
# needed so mypy parses newer-syntax third-party stubs (e.g. numpy, pulled
# in transitively by torch) correctly instead of rejecting them.
python_version = "3.13"
mypy_path = "src"
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
